# config/server.toml —— 运行时常量真值（非机密，随仓库提交；ARCHITECTURE §13.1）

[server]
bind_host = "127.0.0.1"          # 单源：无 env / CLI 覆盖
port = 8081
static_root = "web"
data_dir = "/var/lib/math-drill"  # 部署态；开发态就改本文件这一行

[auth]
cookie_name = "md_session"
cookie_ttl_days = 365
token_file_env = "MATH_DRILL_TOKEN_FILE"

[ratelimit]
api_per_minute = 60          # /api/* 与 /m/*：每**桶**每分钟允许次数，桶键见 ARCHITECTURE §13.1 语义注①（全部请求）
setup_max_failures = 3       # /setup：窗口内允许的失败次数（只计失败）
setup_window_seconds = 3600

[picker]
tau_days = 10
