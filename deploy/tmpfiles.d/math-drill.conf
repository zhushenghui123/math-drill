# deploy/tmpfiles.d/math-drill.conf —— 装到 /etc/tmpfiles.d/math-drill.conf
#
# 为什么需要它（2026-10-07 复核 F1）：访问日志要收权限，但 **systemd 没有 `LogFileMode` 这个指令**
# （实测 `systemd-analyze verify` 报 `Unknown key name 'LogFileMode'`），
# 所以"在 unit 里声明权限"这条路是**行不通的**；用 tmpfiles.d 才是真机制。
#
# `f` = 文件已存在则只校正权限/属主（不创建、不截断）；开机（systemd-tmpfiles-setup）执行一次。
# 属主必须是 **math-drill**：logrotate 用 `su math-drill` 跑，文件若漂成 root:root 会
# READ/WRITE DENIED ⇒ 轮转静默失败（今天实测过的坑）。
#
# 装法：cp -p deploy/tmpfiles.d/math-drill.conf /etc/tmpfiles.d/math-drill.conf
#       systemd-tmpfiles --create /etc/tmpfiles.d/math-drill.conf   # 立即生效一次
f /var/log/math-drill.log 0640 math-drill math-drill -
